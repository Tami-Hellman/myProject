<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MEST - ברוכים הבאים</title>
    <style>
        body {
            background-color: #dfafc9;

            padding: 50px;

        h1 {
            color: #f304b7;

        .button {
